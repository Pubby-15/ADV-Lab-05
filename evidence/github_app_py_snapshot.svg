ext x="126" y="584" style="font:14px 'Courier New',monospace;fill:#a5d6ff">selected_continents = st.sidebar.multiselect(</text><text x="88" y="599" style="font:14px 'Courier New',monospace;fill:#c9d1d9">22</text><text x="126" y="599" style="font:14px 'Courier New',monospace;fill:#c9d1d9">    &quot;Continent&quot;, continents, default=continents</text><text x="88" y="614" style="font:14px 'Courier New',monospace;fill:#c9d1d9">23</text><text x="126" y="614" style="font:14px 'Courier New',monospace;fill:#c9d1d9">)</text><text x="88" y="629" style="font:14px 'Courier New',monospace;fill:#c9d1d9">24</text><text x="126" y="629" style="font:14px 'Courier New',monospace;fill:#c9d1d9"> </text><text x="88" y="644" style="font:14px 'Courier New',monospace;fill:#c9d1d9">25</text><text x="126" y="644" style="font:14px 'Courier New',monospace;fill:#c9d1d9">filtered = df[(df[&quot;year&quot;] == selected_year) &amp; (df[&quot;continent&quot;].isin(selected_continents))].copy()</text><text x="88" y="659" style="font:14px 'Courier New',monospace;fill:#c9d1d9">26</text><text x="126" y="659" style="font:14px 'Courier New',monospace;fill:#c9d1d9"> </text><text x="88" y="674" style="font:14px 'Courier New',monospace;fill:#c9d1d9">27</text><text x="126" y="674" style="font:14px 'Courier New',monospace;fill:#a5d6ff">st.subheader(&quot;Key Metrics&quot;)</text><text x="88" y="689" style="font:14px 'Courier New',monospace;fill:#c9d1d9">28</text><text x="126" y="689" style="font:14px 'Courier New',monospace;fill:#a5d6ff">col1, col2, col3 = st.columns(3)</text><text x="88" y="704" style="font:14px 'Courier New',monospace;fill:#c9d1d9">29</text><text x="126" y="704" style="font:14px 'Courier New',monospace;fill:#c9d1d9">col1.metric(&quot;Countries&quot;, int(filtered[&quot;country&quot;].nunique()))</text><text x="88" y="719" style="font:14px 'Courier New',monospace;fill:#c9d1d9">30</text><text x="126" y="719" style="font:14px 'Courier New',monospace;fill:#c9d1d9">col2.metric(&quot;Median life expectancy&quot;, f&apos;{filtered[&quot;lifeExp&quot;].median():.1f} yrs&apos;)</text><text x="88" y="734" style="font:14px 'Courier New',monospace;fill:#c9d1d9">31</text><text x="126" y="734" style="font:14px 'Courier New',monospace;fill:#c9d1d9">col3.metric(&quot;Total population&quot;, f&apos;{filtered[&quot;pop&quot;].sum() / 1_000_000:.2f} B&apos;)</text><text x="88" y="749" style="font:14px 'Courier New',monospace;fill:#c9d1d9">32</text><text x="126" y="749" style="font:14px 'Courier New',monospace;fill:#c9d1d9"> </text><text x="88" y="764" style="font:14px 'Courier New',monospace;fill:#c9d1d9">33</text><text x="126" y="764" style="font:14px 'Courier New',monospace;fill:#a5d6ff">st.subheader(&quot;GDP per Capita vs Life Expectancy&quot;)</text><text x="88" y="779" style="font:14px 'Courier New',monospace;fill:#c9d1d9">34</text><text x="126" y="779" style="font:14px 'Courier New',monospace;fill:#c9d1d9">if filtered.empty:</text><text x="88" y="794" style="font:14px 'Courier New',monospace;fill:#c9d1d9">35</text><text x="126" y="794" style="font:14px 'Courier New',monospace;fill:#a5d6ff">    st.warning(&quot;No records match the selected filters.&quot;)</text><text x="88" y="809" style="font:14px 'Courier New',monospace;fill:#c9d1d9">36</text><text x="126" y="809" style="font:14px 'Courier New',monospace;fill:#c9d1d9">else:</text><text x="88" y="824" style="font:14px 'Courier New',monospace;fill:#c9d1d9">37</text><text x="126" y="824" style="font:14px 'Courier New',monospace;fill:#c9d1d9">    fig = px.scatter(filtered, x=&quot;gdpPercap&quot;, y=&quot;lifeExp&quot;, size=&quot;pop&quot;, color=&quot;continent&quot;)</text><text x="88" y="839" style="font:14px 'Courier New',monospace;fill:#c9d1d9">38</text><text x="126" y="839" style="font:14px 'Courier New',monospace;fill:#a5d6ff">    st.plotly_chart(fig, use_container_width=True)</text>
